{{define "login"}}
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} - {{template "branding_title" .}}</title>
    <link rel="stylesheet" href="/static/css/pico.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
    {{template "branding_head" .}}
</head>
<body>
    <main class="container">
        <div class="auth-container">
            <div class="auth-brand">
                {{if and .Branding .Branding.LogoURL}}
                <img src="{{.Branding.LogoURL}}" alt="{{.Branding.Name}}" class="auth-logo">
                {{end}}
                <h1>{{template "branding_title" .}}</h1>
            </div>
            <p class="subtitle">Iniciar Sesi&oacute;n</p>

            {{if .Error}}
            <div class="alert alert-error">{{.Error}}</div>
            {{end}}

            {{if .Success}}
            <div class="alert alert-success">{{.Success}}</div>
            {{end}}

            <article>
                <form method="POST" action="/auth/login{{if .CompanySlug}}?company={{.CompanySlug}}{{end}}">
                    <label>
                        Email
                        <input type="email" name="email" value="{{.Email}}" placeholder="usuario@ejemplo.com" required autofocus>
                    </label>

                    <label>
                        Contrase&ntilde;a
                        <input type="password" name="password" placeholder="Su contrase&ntilde;a" required>
                    </label>

                    <button type="submit">Iniciar Sesi&oacute;n</button>
                </form>
            </article>
        </div>
    </main>
</body>
</html>
{{end}}
